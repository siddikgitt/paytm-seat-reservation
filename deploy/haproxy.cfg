global
    maxconn 24000
    nbthread 1
    # This HTTP/1.1 listener sits behind Render's TLS/HTTP2 edge. Small buffers
    # keep queued requests affordable; request/response bodies still stream.
    tune.bufsize 4096
    tune.maxrewrite 1024

defaults
    mode http
    retries 0
    timeout connect 5s
    timeout client 540s
    timeout server 60s
    # Leave room for the full 20,000-request queue on fractional CPU, while
    # keeping queue + processing below the strict client's 600-second deadline.
    timeout queue 480s
    timeout http-request 30s
    timeout http-keep-alive 120s

frontend public
    bind "0.0.0.0:${PORT}"
    acl health path -i /readyz /livez /health /metrics
    acl read method GET HEAD
    use_backend health if health
    use_backend reads if read
    default_backend writes

# These are real application responses, including the independent DB check.
# They bypass only the write queue, not authentication or dependency checks.
backend health
    server app "127.0.0.1:${APP_PORT}" maxconn 4

backend reads
    server app "127.0.0.1:${APP_PORT}" maxconn 8

# Queue before allocating servlet/JDBC state. No retry or synthetic success:
# every reservation is still decided by the existing PostgreSQL transaction.
backend writes
    server app "127.0.0.1:${APP_PORT}" maxconn 64 maxqueue 24000
