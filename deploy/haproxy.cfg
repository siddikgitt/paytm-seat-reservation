global
    maxconn 24000
    nbthread 1
    # HTTP/1.1 hosting can use 4 KB buffers. HTTP/2 upstream hosting requires
    # at least 16 KB; bound its buffer pool separately on small containers.
    tune.bufsize "${HAPROXY_BUFFER_SIZE}"
    tune.buffers.limit "${HAPROXY_BUFFER_LIMIT}"
    tune.maxrewrite 1024

# Service addresses can change after a deployment or scale-to-zero. Refresh
# them without restarting the gateway; use an FQDN on Kubernetes/Northflank.
resolvers service_dns
    parse-resolv-conf
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold nx 1s
    hold other 1s
    hold refused 1s
    hold timeout 1s
    hold obsolete 1s

defaults
    mode http
    retries 0
    timeout connect 5s
    timeout client 540s
    timeout server 60s
    # Leave room for the full 20,000-request queue on fractional CPU, while
    # keeping queue + processing below the strict client's 600-second deadline.
    timeout queue 480s
    timeout http-request 30s
    timeout http-keep-alive 120s

frontend public
    bind "0.0.0.0:${PORT}"
    # Attribution only: include HAProxy-generated errors as well as app replies.
    # Early malformed HTTP errors can precede this processing stage.
    http-after-response set-header X-Seat-Ingress haproxy
    acl health path -i /readyz /livez /health /metrics
    acl read method GET HEAD
    use_backend health if health
    use_backend reads if read
    default_backend writes

# These are real application responses, including the independent DB check.
# They bypass only the write queue, not authentication or dependency checks.
backend health
    server app "${APP_HOST}:${APP_PORT}" maxconn 4 resolvers service_dns resolve-prefer ipv4 init-addr last,none

backend reads
    server app "${APP_HOST}:${APP_PORT}" maxconn 8 resolvers service_dns resolve-prefer ipv4 init-addr last,none

# Queue before allocating servlet/JDBC state. No retry or synthetic success:
# every reservation is still decided by the existing PostgreSQL transaction.
backend writes
    server app "${APP_HOST}:${APP_PORT}" maxconn 64 maxqueue 24000 resolvers service_dns resolve-prefer ipv4 init-addr last,none
