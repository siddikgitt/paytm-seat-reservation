server:
  port: ${PORT:8080}
  shutdown: graceful
  tomcat:
    # Bound per-connection buffers on a 512 MB instance. Extra connections wait
    # in the OS/proxy backlog instead of allocating 20,000 servlet requests.
    max-connections: ${HTTP_MAX_CONNECTIONS:2048}
    accept-count: ${HTTP_ACCEPT_COUNT:20000}
    keep-alive-timeout: 120s
    connection-timeout: 30s

spring:
  application:
    name: seat-reservation
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/seats}
    username: ${SPRING_DATASOURCE_USERNAME:seats}
    password: ${SPRING_DATASOURCE_PASSWORD:seats}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}
      # Requests wait for a connection instead of failing during a stampede.
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:30000}
      pool-name: seats-pool
  flyway:
    enabled: true
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    deserialization:
      accept-float-as-int: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

app:
  jwt-secret: ${JWT_SECRET:dev-only-secret-change-me}
  admin-api-key: ${ADMIN_API_KEY:dev-admin-key}
  token-ttl: ${TOKEN_TTL:24h}
  default-per-user-limit: 4
  max-seats-per-show: 20000
  metrics:
    tracked-shows: 20
    refresh-ms: 1000
  admission:
    # Write requests allowed to touch the DB at once; the rest queue for up to max-wait, then get 429.
    max-concurrent: ${ADMISSION_MAX_CONCURRENT:64}
    max-wait: ${ADMISSION_MAX_WAIT:25s}

management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: health,prometheus,info
      path-mapping:
        prometheus: metrics
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: always
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,database
  health:
    db:
      enabled: false
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 10ms,50ms,100ms,250ms,500ms,1s,2s,5s
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    com.zaxxer.hikari: WARN
    org.flywaydb: INFO
